<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
    .frame-wrapper {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: -24.3px;
      left: 0;
      width: 111.1111%;
      height: calc(111.1111% + 24.3px);
      transform: scale(0.9);
      transform-origin: top left;
      border: none;
    }
    @media (max-width: 640px) {
      iframe {
        top: -44px;
        width: 100%;
        height: calc(100% + 44px);
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="frame-wrapper">
